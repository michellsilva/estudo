[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postmortemforge"
version = "0.1.0"
description = "Reconstruct an incident timeline from exported evidence and draft a cited postmortem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michel Silva" }]
keywords = ["incident", "postmortem", "timeline", "provenance"]

[project.scripts]
postmortemforge = "postmortemforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

